<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SILKSPAN — a silk-line crate game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d3b3f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* Read aloud by screen readers, never shown on the page. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="SILKSPAN: string taut silk between posts to sling falling harvest crates into the bays of a loading dock"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
